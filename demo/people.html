<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vacancy people demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#efe4cf;overflow:hidden;user-select:none;-webkit-user-select:none;font:14px "Noto Sans",system-ui,sans-serif;color:#3a2d24}
#hud{position:fixed;left:12px;top:10px;background:rgba(239,228,207,.88);padding:8px 12px;border-radius:8px;pointer-events:none}
#hud label{pointer-events:auto}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="hud"><b>People demo</b> <span id="info"></span><br>
<label>Crowd <input id="tgt" type="range" min="0" max="500" value="250"></label>
<label>Mood <input id="mood" type="range" min="0" max="100" value="60"></label>
<span>Drag to orbit, wheel to zoom. Add ?mall to use the real mall data.</span></div>
<script src="../src/people.js"></script>
<script src="fixture-nav.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
async function getNav(){
  if(location.search.includes('mall')){
    await new Promise((ok,no)=>{const s=document.createElement('script');s.src='../src/mall-data.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    return {nav:window.Vacancy.peopleNav(),units:1};
  }
  return {nav:VacancyFixtureNav(),units:1};
}
const {nav,units}=await getNav();
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xefe4cf);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.5,3000);cam.position.set(60,160,260);
const ctl=new OrbitControls(cam,renderer.domElement);ctl.target.set(0,5,0);
scene.add(new THREE.HemisphereLight(0xfff3dc,0xb98a62,1.5));const sun=new THREE.DirectionalLight(0xffe2b8,1.6);sun.position.set(80,160,60);scene.add(sun);
// floors and corridors, so the walking is easy to judge
for(const lv of nav.levels){
  const fl=new THREE.Mesh(new THREE.BoxGeometry(520,0.4,260),new THREE.MeshLambertMaterial({color:0xd9c3a0,transparent:true,opacity:lv.id?0.45:0.9}));fl.position.set(0,lv.z-0.25,0);scene.add(fl);
}
for(const c of nav.corridors){const z=nav.levels.find(l=>l.id===c.level).z;
  for(let i=1;i<c.pts.length;i++){const a=c.pts[i-1],b=c.pts[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const m=new THREE.Mesh(new THREE.BoxGeometry(L,0.1,c.halfWidth*2),new THREE.MeshLambertMaterial({color:0xefe4cf}));
    m.position.set((a[0]+b[0])/2,z+0.02,(a[1]+b[1])/2);m.rotation.y=-Math.atan2(b[1]-a[1],b[0]-a[0]);scene.add(m)}}
const boxM=new THREE.MeshLambertMaterial({color:0xc0643e});
for(const s of nav.stores){const z=nav.levels.find(l=>l.id===s.level).z;
  const m=new THREE.Mesh(new THREE.BoxGeometry(14,3,0.4),new THREE.MeshLambertMaterial({color:s.open?0xc0643e:0x8a8070}));
  const dx=s.inside[0]-s.door[0],dy=s.inside[1]-s.door[1];m.position.set(s.door[0]+dx*1.6,z+1.5,s.door[1]+dy*1.6);
  if(Math.abs(dy)>Math.abs(dx)){m.rotation.y=0}else{m.rotation.y=Math.PI/2}scene.add(m)}
const crowd=VacancyPeople.create(nav,{units,seed:5});
const rend=VacancyPeople.createRenderer(THREE,crowd,{scene,camera:cam});
const tgt=document.getElementById('tgt'),mood=document.getElementById('mood'),info=document.getElementById('info');
const sync=()=>crowd.setFootfall({target:+tgt.value,mood:+mood.value/100});tgt.oninput=mood.oninput=sync;sync();
window.__crowd=crowd;window.__cam=cam;window.__ctl=ctl;
let last=performance.now(),acc=0,frames=0;
function loop(t){const dt=Math.min(0.1,(t-last)/1000);last=t;
  crowd.update(dt);rend.update();ctl.update();renderer.render(scene,cam);
  acc+=dt;frames++;if(acc>.5){info.textContent=`· ${crowd.n} shoppers · ${crowd.stats.rides} escalator rides · ${Object.values(crowd.stats.visits).reduce((a,b)=>a+b,0)} store visits · ${(frames/acc)|0} fps`;acc=0;frames=0}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
